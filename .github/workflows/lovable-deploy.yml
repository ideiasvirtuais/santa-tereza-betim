name: "Build e Deploy para stable-website"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout do Repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: "Instalar Dependencias"
        run: npm install

      - name: "Rodar Build"
        run: npm run build

      - name: "Localizar shell do TanStack Start (SPA mode)"
        id: locate-shell
        run: |
          SHELL_FILE=$(find dist .output -name _shell.html -not -path "*/node_modules/*" 2>/dev/null | head -n 1)
          if [ -z "$SHELL_FILE" ]; then
            echo "::error::_shell.html nao encontrado em dist/ ou .output/"
            find dist .output -maxdepth 3 2>/dev/null | head -50
            exit 1
          fi
          echo "Encontrado: $SHELL_FILE"
          echo "deploy_dir=$(dirname "$SHELL_FILE")" >> "$GITHUB_OUTPUT"

      - name: "Gerar .htaccess para Apache"
        run: |
          cat > "${{ steps.locate-shell.outputs.deploy_dir }}/.htaccess" <<'HTACCESS'
          # TanStack Start SPA hospedado em Apache
          DirectoryIndex _shell.html

          RewriteEngine On

          # Forcar HTTPS: todo acesso http vira https no mesmo endereco
          # (a condicao extra evita laco de redirecionamento atras de proxy)
          RewriteCond %{HTTPS} !=on
          RewriteCond %{HTTP:X-Forwarded-Proto} !https
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

          # SPA fallback: rotas inexistentes caem no _shell.html
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ _shell.html [L]

          <IfModule mod_headers.c>
            <FilesMatch "_shell\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
            <FilesMatch "\.(?:js|css|woff2|woff|svg|png|jpg|jpeg|webp|gif|ico)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>
          HTACCESS

      - name: "Gravar versao do deploy"
        run: echo "${{ github.sha }}" > "${{ steps.locate-shell.outputs.deploy_dir }}/deploy-version.txt"

      - name: "Deploy para a Branch stable-website"
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stable-website
          folder: ${{ steps.locate-shell.outputs.deploy_dir }}
          clean: true

      - name: "Enviar por FTP para a hospedagem"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.locate-shell.outputs.deploy_dir }}/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'www/' }}

      - name: "Verificar se o site no ar recebeu esta versao"
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          SITE_URL="${SITE_URL:-https://www.lavanderiasantatereza.com.br}"
          ESPERADA="${{ github.sha }}"
          for i in $(seq 1 10); do
            ATUAL=$(curl -s -H "Cache-Control: no-cache" "$SITE_URL/deploy-version.txt" || true)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
            if [ "$ATUAL" = "$ESPERADA" ] && [ "$STATUS" = "200" ]; then
              echo "O site no ar confirma a versao $ESPERADA (pagina inicial com status $STATUS)."
              exit 0
            fi
            echo "tentativa $i: versao no ar='$ATUAL' status da pagina inicial=$STATUS"
            sleep 15
          done
          echo "::error::O site no ar nao confirmou a versao nova. O envio por FTP pode ter falhado."
          exit 1
